<script>

async function populateLatestBookReview() {
  const response = await fetch("books.json");
  const books = await response.json();
  const latest = books
    .filter(b => b.title && b.review)
    .sort((a, b) =>
      new Date(b.dateReviewed || b.date) -
      new Date(a.dateReviewed || a.date)
    )[0];
  const el = document.getElementById("latestBookReview");
  if (latest && el) {
    const plainText = latest.review.replace(/<[^>]*>/g, "");
const preview = plainText
  .split(/\s+/)
  .slice(0, 20)
  .join(" ") + "...";
    el.href = `books.html?book=${encodeURIComponent(latest.title)}`;
    el.innerHTML = `
      <div class="latest-book-title">${latest.title}</div>
      <div class="latest-book-date">${latest.dateReviewed || latest.date}</div>
      <div class="latest-book-preview">${preview}</div>
    `;
  }
}
window.addEventListener("DOMContentLoaded", populateLatestBookReview);
window.addEventListener("DOMContentLoaded", populateLatestBookReview);
</script>
    
  <script>
    fetch("posts.json")
      .then(response => response.json())
      .then(posts => {
        
        // Sort newest first
        posts.sort((a, b) => new Date(b.datetime) - new Date(a.datetime));

        const recentPosts = document.getElementById("recent-posts");
        const boardGames = document.getElementById("board-games");
        const faith = document.getElementById("faith");
        
        // Sidebar
        posts.slice(0, 3).forEach(post => {
          const item = document.createElement("div");  
          item.innerHTML = `
            <a class="sidebar-link" href="${post.link}">
              <span class="sidebar-title">${post.title}</span>
            <div class="sidebar-date">
              ${new Date(post.datetime).toLocaleDateString()}
            </div>
            ${
              post.readTime
                ? `<div class="sidebar-readtime">${post.readTime}</div>`
                : ''
            }
            </a>
          `;
        recentPosts.appendChild(item);
        });
        const allPostsLink = document.createElement("div");
        allPostsLink.innerHTML = `
          <a class="sidebar-link all-posts-link" href="all-posts.html">
            View All Posts
          </a>
        `;
        recentPosts.appendChild(allPostsLink);
        
        // Main cards
        posts.forEach(post => {
          if (!post.coverImage) return;
          const li = document.createElement("li");
          li.className = "navitem";
          li.innerHTML = `
            <a href="${post.link}">
              <img
                src="${post.coverImage}"
                alt="${post.title}"
                class="card-image"
              >
              <div class="card-title">${post.title}</div>
                ${
                  post.readTime
                    ? `<div class="card-readtime">${post.readTime}</div>`
                    : ''
                }
            </a>
          `;
          switch(post.topic) {
            case "Board Games":
              boardGames.appendChild(li);
              break;
            case "Faith":
              faith.appendChild(li);
              break;
            }
          });
        });
    </script>

function applyTheme(name) {
  const t = themes[name];
  document.documentElement.style.setProperty('--bg-color', t.bg);
  document.documentElement.style.setProperty('--nav-fill', t.nav);
  document.documentElement.style.setProperty('--heading-fill', t.heading);
  document.documentElement.style.setProperty('--border-color', t.border);
}

document.getElementById("themeSelect").addEventListener("change", e => {
  applyTheme(e.target.value);
});
