<html>
  <head>
    <meta charset="utf-8" />
    <title>IN HOC LUDE</title>
    <link rel="stylesheet" href="m/index.css"/>
  </head>
  <body>

    <aside class="sidebar">
      <div class="rightindex">
        <p id="latestUpdate"></p>
        <i>Recent Posts</i>
        <div id="recent-posts"></div>
      </div>
    </aside>
    
    <main class="main">
    <h1 class="centertext">
      Is it possible for a man to love board games and Jesus Christ?
    </h1>
    <p class="centertext">
      Opinionated Board Game Blog While Living Intra Tua Vulnera
    </p>
    <p class="centertext">
      Writing that's joyous, thoughtful, and sometimes bitter.
    </p>
    <hr class="superspace"/>

    <h2 class="centertext">
      Board Games
    </h2>
    <ul id="board-games" class="centernav"></ul>
    <hr class="superspace"/>
    
    <h2 class="centertext">
      Faith
    </h2>
    <ul id="faith" class="centernav"></ul>
    <hr class="superspace">

    <h2 class="centertext">
      Other
    </h2>
    <ul class="centernav">
      <li class="navitem">
        <a href="books.html">
          <img src="books/man-writing-book-reviews.gif"/>
          <div>Book Reviews</div>
        </a>
      </li>
      <li class="navitem">
        <a href="dreams.html">
          <img src="m/dreamsAssets/sleeping-moon.gif"/>
          <div>Dreams</div>
        </a>
      </li>
    </ul>
    <hr class="superspace"/>

  </main>
    
  <script>
    fetch("posts.json")
      .then(response => response.json())
      .then(posts => {
        
        // Sort newest first
        posts.sort((a, b) => new Date(b.datetime) - new Date(a.datetime));

        const recentPosts = document.getElementById("recent-posts");
        const boardGames = document.getElementById("board-games");
        const faith = document.getElementById("faith");
        
        // Sidebar
        posts.slice(0, 3).forEach(post => {
          const item = document.createElement("div");  
          item.innerHTML = `
            <a class="sidebar-link" href="${post.link}">
              <span class="sidebar-title">${post.title}</span>
            <div class="sidebar-date">
              ${new Date(post.datetime).toLocaleDateString()}
            </div>
            ${
              post.readTime
                ? `<div class="sidebar-readtime">${post.readTime}</div>`
                : ''
            }
            </a>
          `;
        recentPosts.appendChild(item);
        });
        const allPostsLink = document.createElement("div");
        allPostsLink.innerHTML = `
          <a class="sidebar-link all-posts-link" href="all-posts.html">
            View All Posts
          </a>
        `;
        recentPosts.appendChild(allPostsLink);
        
        // Main cards
        posts.forEach(post => {
          if (!post.coverImage) return;
          const li = document.createElement("li");
          li.className = "navitem";
          li.innerHTML = `
            <a href="${post.link}">
              <img
                src="${post.coverImage}"
                alt="${post.title}"
                class="card-image"
              >
              <div class="card-title">${post.title}</div>
                ${
                  post.readTime
                    ? `<div class="card-readtime">${post.readTime}</div>`
                    : ''
                }
            </a>
          `;
          switch(post.topic) {
            case "Board Games":
              boardGames.appendChild(li);
              break;
            case "Faith":
              faith.appendChild(li);
              break;
            }
          });
        });
    </script>
    
    <script src="updates/dailyUpdates.js"> </script>
    <script src="updates/updates.js"> </script>
    <script>
      const update = getLatestUpdate();

      document.getElementById("latestUpdate").innerHTML = `
        <div>${update.timestamp.toLocaleString()}</div>
        <div>${update.text}</div>
      `;
    </script>
  
  </body>
</html>
