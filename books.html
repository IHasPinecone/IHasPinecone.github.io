<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root {
  --wood-light: #c58b6b;
  --wood-dark: #8b5a3c;
  --shelf-shadow: rgba(0,0,0,0.35);
}

body {
  margin: 0;
  font-family: Georgia, serif;
  background: #3a2b23;
}

  /* ---------- PAGE DESCRIPTION ---------- */
.description {
  max-width: 1008px;
  margin: 24px auto 16px;
  padding: 20px 24px;
  background: rgba(255, 247, 235, 0.9);
  border-left: 6px solid #6b3e26;
  font-size: 16px;
  line-height: 1.6;
  color: #2b1b12;
}

.description p {
  margin: 0;
}

/* Label */
.shelf-label {
  position: absolute;
  top: -20px;
  left: 16px;

  background: linear-gradient(to bottom, #d2a679, #8b5a3c);
  color: #2b1b12;

  padding: 8px 22px;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 0.5px;

  border-radius: 4px;

  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.2),
    inset 0 -3px 5px rgba(0,0,0,0.4),
    2px 3px 6px rgba(0,0,0,0.5);

  border: 1px solid #5c3a27;

  text-align: center;
}


/* ---------- TOGGLE ---------- */
.controls {
  padding: 16px;
  background: #241812;
  text-align: center;
}

button {
  background: #c9a27d;
  border: none;
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
}

/* ---------- BOOKSHELF ---------- */
.bookshelf {
  width: 1016px;
  margin: 0 auto;
  padding: 20px;

  background: #7b4a2f /*#5a3726*/
  box-shadow:
    inset 0 0 20px rgba(0,0,0,0.4);

  background:
    repeating-linear-gradient(
      90deg,
      #6b3e26 0px,
      #6b3e26 40px,
      #5a3322 40px,
      #5a3322 80px
      );
}

bookshelf::before,
.bookshelf::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 28px;
  background: linear-gradient(to right, #5a3726, #3f2618);
  box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
}

.bookshelf::before {
  left: -28px;
}

.bookshelf::after {
  right: -28px;
}

.shelf {
  position: relative;
  margin-bottom: 45px;
  padding: 24px 24px 0;
  background: linear-gradient(
    to bottom,
    var(--wood-light),
    var(--wood-dark)
  );
  box-shadow: inset 0 -6px 12px var(--shelf-shadow);
  display: flex;
  gap: 24px;
  align-items: flex-end;
}

/* shelf lip */
.shelf::after {
  content: "";
  position: absolute;
  bottom: -18px;
  left: 0;
  width: 100%;
  height: 18px;
  background: linear-gradient(
    to bottom,
    #6d432c,
    #3f2618
  );
}


/* ---------- BOOK ---------- */
.book {
  display: flex;
  align-items: flex-end;
  gap: 24px;
}

.cover {
  width: 140px;
  height: 200px;
  object-fit: cover;
  display: block;

  transform: none;
  /* border: 1px solid black; */

  box-shadow: 3px 0px 6px rgba(0,0,0,0.5);

  transition: transform 0.2s ease;
}

.book:hover .cover {
  transform: translateY(-10px);
  box-shadow: 
    6px 12px 16px rgba(0,0,0,0.5);
}



/* ---------- REVIEW ---------- */
.review {
  display: none;
  max-width: 700px;
  color: #111;
  background: rgba(255,255,255,0.85);
  padding: 16px;
  line-height: 1.6;
  font-size: 20px;
  margin-bottom: 12px;
}

/* ---------- MODES ---------- */
.bookshelf.review-mode .shelf {
  flex-direction: column;
}

.bookshelf.review-mode .book {
  flex-direction: row;
}

.bookshelf.review-mode .review {
  display: block;
}

.bookshelf.review-mode .cover {
  width: 180px;
  height: 260px;
}


/* ---------- MODAL ---------- */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  inset: 0;
  background: rgba(0,0,0,0.7);
}

.modal-content {
  max-width: 800px;
  max-height: 85vh;
  margin: 5vh auto;
  background: #fff;
  padding: 24px;
  border-radius: 8px;
  overflow-y: auto;
  position: relative;
}

/* ---------- HEADER ---------- */
.modal-header {
  position: sticky;
  top: 0;
  background: #fff;
  padding-bottom: 10px;
  margin-bottom: 16px;
  border-bottom: 1px solid #ddd;
  z-index: 1;
}

.modal-header h2 {
  margin: 0;
  font-family: Georgia, serif;
}

/* ---------- COVER + TEXT FLOW ---------- */
.modal-cover {
  width: 180px;
  float: left;   
  margin: 0 20px 12px 0;
  box-shadow: 4px 4px 8px rgba(0,0,0,0.4);
}

.modal-date {
  font-style: italic;
  opacity: 0.8;
  font-size: 14px;
  color: #666;
  margin-top: 4px;
  margin-bottom: 10px;
}

.modal-review {
  line-height: 1.6;
  font-size: 15px;
}

/* close button */
.close-btn {
  position: absolute;
  top: 0px;
  right: 20px;
  font-size: 26px;
  cursor: pointer;
}


  /* ---------- METADATA ---------- */
.meta {
  text-align: center;
  margin-top: 8px;
  font-size: 14px;
  display: none;
}

.title {
  font-weight: bold;
}

.date {
  opacity: 0.8;
  font-size: 13px;
}

.tag {
  display: inline-block;
  margin-top: 6px;
  padding: 2px 8px;
  font-size: 12px;
  background: #6b3e26;
  color: #fff;
  border-radius: 12px;
}

/* ---------- REVIEW MODE LAYOUT ---------- */
.bookshelf.review-mode .meta {
  text-align: left;
  margin-top: 0;
  display: block;
}

.bookshelf.review-mode .tag {
  background: #8a4f2d;
}
</style>

<title>
  Pine's Bookshelf
</title>
<meta content="Pine's Bookshelf" property="og:title" />
<meta content="The thing holding me back from donating all my old books is I liked seeing them sitting on my shelf. I made this page as a compromise. I've also jotted down a short review for each one." property="og:description" />
<meta content="https://ihaspinecone.github.io/books.html" property="og:url" />
<meta content="https://ihaspinecone.github.io/books/man-writing-book-reviews.gif" property="og:image" />
<meta content="15844367" data-react-helmet="true" name="theme-color" />
<meta name="twitter:card" content="summary_large_image">
</head>

<body>

<header class="description">
  <p>
    I wanted to donate all my old books, but I didn't want to get rid of them because I liked seeing them on my shelf. I made this page as a compromise.<br>I've jotted down a short review for each one.
  </p>
</header>

<div class="controls">
  <button onclick="toggleMode()">Toggle "See All Reviews"</button>
</div>

<div class="bookshelf" id ="bookshelf"></div>

  

<div class="controls">
  <a href="index.html">
    <img class="controls" src="bg\RWAssets\back.gif"/>
  </a>
</div>

<script>
function toggleMode() {
  reviewMode = !reviewMode;

  bookshelf.classList.toggle("review-mode", reviewMode);
  bookshelf.innerHTML = "";

  if (reviewMode) {
    // REVIEW MODE: one book per shelf
    originalShelves.forEach(shelf => {
      shelf.querySelectorAll(".book").forEach(book => {
        const newShelf = document.createElement("div");
        newShelf.className = "shelf";
        newShelf.appendChild(book.cloneNode(true));
        bookshelf.appendChild(newShelf);
      });
    });
  } else {
    // SHELF MODE: restore original shelves
    originalShelves.forEach(shelf => {
      bookshelf.appendChild(shelf.cloneNode(true));
    });
  }
  attachBookClicks();
}
</script>

<script>
function attachBookClicks() {
  document.querySelectorAll(".book").forEach(book => {
    book.onclick = () => openModal(book);
  });
}
  
function openModal(book) {
  const modal = document.getElementById("bookModal");

  document.getElementById("modalCover").src =
    book.querySelector(".cover").src;

  document.getElementById("modalTitle").textContent =
    book.querySelector(".title").textContent;

  document.getElementById("modalDate").textContent =
  book.querySelector(".date").textContent;

  document.getElementById("modalReview").innerHTML =
    book.querySelector(".review").innerHTML;

  modal.style.display = "block";
  document.body.style.overflow = "hidden";
}
  
function closeModal() {
  document.getElementById("bookModal").style.display = "none";
  document.body.style.overflow = "";
}

// close when clicking outside
window.onclick = function(e) {
  const modal = document.getElementById("bookModal");
  if (e.target === modal) {
    closeModal();
  }
};

function icks() {
  attachBookClicks();
}

// run initially
attachBookClicks();

</script>

<div id="bookModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <div id="modalDate" class="modal-date"></div>
      <span class="close-btn" onclick="closeModal()">&times;</span>
    </div>

    <img id="modalCover" class="modal-cover">

    <div id="modalReview" class="modal-review"></div>
  </div>
</div>

<!-- reads json file -->
<script>
const bookshelf = document.getElementById("bookshelf");
let originalShelves = [];
let reviewMode = false;

fetch("books.json")
  .then(res => res.json())
  .then(data => {
    buildShelves(data);
    attachBookClicks();
  });

function buildShelves(data) {
  bookshelf.innerHTML = "";

  const shelves = {};

  data.forEach(book => {
    // don't display template
    if (!book.title) return;

    if (!book.review) {
        book.review = "(no review)";
      }
    
    if (!shelves[book.shelf]) {
      const shelf = document.createElement("div");
      shelf.className = "shelf";

      // label
      const label = document.createElement("div");
      label.className = "shelf-label";
      label.textContent = book.shelf;

      shelf.appendChild(label);
      shelves[book.shelf] = shelf;
    }

    // create book
    const bookEl = document.createElement("div");
    bookEl.className = "book";

    bookEl.innerHTML = `
      <div class="book-cover">
        <img class="cover" src="${book.cover}">
      </div>
      <div class="meta">
        <div class="title">${book.title}</div>
        <div class="date">${book.date}</div>
      </div>
      <div class="review">
        ${book.review
          .split("\n\n")
          .map(p => `<p>${p}</p>`)
          .join("")
        }
      </div>
    `;

    shelves[book.shelf].appendChild(bookEl);
  });

  // Add shelves to page
  Object.values(shelves).forEach(shelf => {
    bookshelf.appendChild(shelf);
  });

  // Save layout for toggle
  originalShelves = [...bookshelf.children].map(s => s.cloneNode(true));
}
  
</script>

</body>
</html>
