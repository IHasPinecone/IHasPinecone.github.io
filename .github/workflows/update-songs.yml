name: Update Song Metadata and Covers

on:
  push:
    paths:
      - 'songs.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-songs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Run Song Metadata Updater
      run: node scripts/update_songs.js

      - name: Commit and push changes if any
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.io'
          git add songs.json songs/
          git diff --staged --quiet || git commit -m "Auto-update album art under /songs/ and release years from iTunes API"
          git push
