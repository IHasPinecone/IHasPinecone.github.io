name: Update Song Metadata and Covers

on:
  push:
    paths:
      - 'songs.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-songs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Song Metadata Updater
        run: python scripts/update_songs.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.io'
          git add songs.json songs/
          git diff --staged --quiet || git commit -m "Auto-update album art under /songs/ and release years from iTunes API"
          git push
