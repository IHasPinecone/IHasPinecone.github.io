<body>
  <h1>Art Dump 1</h1>
  <p class="gallery-description">
    While looking at art for <a href="../faith/star-in-the-east.html">Tell The Prince There is a Star in the East</a> I ended up looking at a lot of pieces I liked, but didn't fit the words.
  </p>
  <div class="gallery">

    <div class="art-piece">
        <img src="1/Józef_Chełmoński_Anioł_i_dzieci_wiejskie.jpg" alt="alt text here">
        <p class="caption">
            this is the text under the work. Lorem Ipsum Dolor Sit Amet
        </p>
    </div>

    <div class="art-piece">
        <img src="1/Józef_Chełmoński_Kosynierzy.jpg" alt="other alt text">
    </div>

</div>

<div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="">
</div>

  <script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    document.querySelectorAll(".art-piece img").forEach(img => {
      img.addEventListener("click", () => {
        lightboxImg.src = img.src;
        lightbox.classList.add("active");
      });
    });
    lightbox.addEventListener("click", () => {
      lightbox.classList.remove("active");
    });
  </script>
</body>
