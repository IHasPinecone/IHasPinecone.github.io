<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Posts</title>
    <link rel="stylesheet" href="m/all-posts.css"container">
</head>
<body>

    <div id="container">

        <header>
            <h1>ALL POSTS</h1>
            <p class="subtitle">everything in order</p>
            <hr>
        </header>

        <main id="posts-list"></main>

    </div>

    <p>
        <a href="index.html">
            <img class="centerimage" src="bg\RWAssets\back.gif"/>
        </a>
    </p>

    <script>
        async function loadPosts() {
            const response = await fetch("posts.json");
            const posts = await response.json();

            posts.sort((a, b) => {
                const dateA = new Date(a.datetime);
                const dateB = new Date(b.datetime);
                return dateB - dateA;
            });

            const postList = document.getElementById("posts-list");

            posts.forEach(post => {

                const image = post.coverImage && post.coverImage.trim() !== ""
                    ? post.coverImage
                    : "bg/ph/ph1.webp";

                const article = document.createElement("article");
                article.className = "post";

                article.innerHTML = `
                    <a href="${post.link}" class="post-link">

                        <img
                            src="${image}"
                            alt="${post.title}"
                            class="thumbnail">

                        <div class="content">
                            <h2>${post.title}</h2>

                            <div class="meta">
                                ${post.datetime}
                                ${post.topic ? " | " + post.topic : ""}
                                ${post.readTime ? " " + post.readTime : ""}
                            </div>
                        </div>

                    </a>
                `;

                postList.appendChild(article);
            });
        }

        loadPosts();
    </script>

</body>
</html>
