      margin: 0 0 8px 0;
      text-shadow: 2px 2px #ff00ff;

      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .week-header:hover {

      color: #ffff00;
    }

    .week-content {
      display: none;
      padding: 15px;
      background-color: #dcdcdc;
      border-top: 2px groove #ffffff;
    }

    .week-box.active .week-content {
      display: block;
    }

      border: 2px inset #808080;
      padding: 12px;

      align-items: flex-start;
    }

    .song-row:last-child {
      margin-bottom: 0;
    }

      width: 110px;
      height: 110px;
      border: 2px solid #000000;
      object-fit: cover;
      flex-shrink: 0;
      background-color: #000000;
    }
